
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini AI Buddy</title>

<style>
* { box-sizing: border-box; }

body {
  background: #07111f;
  color: #e5faff;
  font-family: Arial, sans-serif;
  max-width: 520px;
  margin: 25px auto;
  padding: 16px;
}

h1 { color: #67e8f9; text-align: center; }

.subtitle {
  text-align: center;
  color: #9fb8ca;
}

input, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid #31516b;
  font-size: 16px;
}

input { background: #102238; color: white; }

button {
  background: #0891b2;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: 0.5; }

#status {
  text-align: center;
  color: #67e8f9;
  margin: 12px;
}

#log {
  background: #102238;
  border: 1px solid #31516b;
  border-radius: 12px;
  padding: 15px;
  min-height: 140px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.small {
  color: #9fb8ca;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>
<h1>🤖 Mini AI Buddy</h1>
<p class="subtitle">Your little AI companion</p>

<input id="apiKey" type="password"
       placeholder="Paste your replacement Gemini API key"
       autocomplete="off">

<button id="connectBtn" onclick="connectBLE()">
  1. Connect TFT 📟
</button>

<button id="talkBtn" onclick="startListening()">
  2. Talk to Buddy 🎤
</button>

<button onclick="disconnectBuddy()">
  Disconnect Bluetooth
</button>

<div id="status">Not connected</div>
<div id="log">Connect your TFT, then tap Talk to Buddy.</div>

<p class="small">
  Open this page in Chrome on Android using HTTPS.
  Allow microphone access when prompted.
</p>

<script>
"use strict";

// Keep these UUIDs identical to the ESP32 sketch.
const SERVICE_UUID =
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
  "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

// Current model name. If unavailable, use a model listed
// by your Gemini API key that supports generateContent.
const GEMINI_MODEL = "gemini-3.8-flash";

let bluetoothDevice = null;
let characteristic = null;
let history = [];
let busy = false;
let recognition = null;
let requestNumber = 0;

// ---------- DISPLAY HELPERS ----------

function log(message) {
  document.getElementById("log").textContent = message;
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ---------- BLUETOOTH ----------

async function sendBLE(message) {
  if (!characteristic) return;

  const bytes = new TextEncoder().encode(message);

  if (bytes.length > 20) {
    throw new Error("Bluetooth message exceeds 20 bytes.");
  }

  if (characteristic.writeValueWithoutResponse) {
    await characteristic.writeValueWithoutResponse(bytes);
  } else {
    await characteristic.writeValue(bytes);
  }

  await delay(100);
}

async function sendStatus(status) {
  if (characteristic) {
    await sendBLE("STATUS:" + status);
  }
}

async function sendLines(text) {
  if (!characteristic) return;

  // The ESP32 currently accepts short LINE messages.
  // Each new LINE may replace the previous TFT text.
  const words = text
    .replace(/[^\x20-\x7E]/g, "")
    .split(/\s+/);

  let line = "";

  for (const word of words) {
    if (!word) continue;

    if ((line ? line + " " : "") .length + word.length > 14) {
      if (line) await sendBLE("LINE:" + line);
      line = "";
    }

    // Split any unusually long word.
    let remaining = word;

    while (remaining.length > 14) {
      if (line) {
        await sendBLE("LINE:" + line);
        line = "";
      }

      await sendBLE("LINE:" + remaining.slice(0, 14));
      remaining = remaining.slice(14);
    }

    if (remaining) {
      line = line ? line + " " + remaining : remaining;
    }
  }

  if (line) {
    await sendBLE("LINE:" + line);
  }
}

async function connectBLE() {
  try {
    if (!navigator.bluetooth) {
      throw new Error(
        "Web Bluetooth is unavailable. Open this page in Chrome using HTTPS."
      );
    }

    setStatus("Opening Bluetooth selector...");

    bluetoothDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: "MiniAIBuddy" }],
      optionalServices: [SERVICE_UUID]
    });

    setStatus("Connecting to " + bluetoothDevice.name + "...");

    bluetoothDevice.addEventListener(
      "gattserverdisconnected",
      () => {
        characteristic = null;
        setStatus("Bluetooth disconnected");
      }
    );

    const server = await bluetoothDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    characteristic = await service.getCharacteristic(RX_UUID);

    setStatus("Connected to MiniAIBuddy!");
    log("TFT connected successfully. Ask me anything!");

    await sendStatus("READY");

  } catch (error) {
    setStatus("Bluetooth connection failed");
    log("Bluetooth error: " + error.message);
  }
}

function disconnectBuddy() {
  if (bluetoothDevice?.gatt?.connected) {
    bluetoothDevice.gatt.disconnect();
  }

  characteristic = null;
  setStatus("Disconnected");
}

// ---------- GEMINI REQUEST ----------

async function generateGemini(contents) {
  const key = document.getElementById("apiKey").value.trim();

  if (!key) {
    throw new Error("Enter your Gemini API key first.");
  }

  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    GEMINI_MODEL + ":generateContent";

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      systemInstruction: {
        parts: [{
          text:
            "You are Mini AI Buddy, a friendly, intelligent robot " +
            "companion. Answer the user's actual question in simple, " +
            "natural English. Usually use two to four complete sentences. " +
            "Finish every sentence and thought. Avoid unnecessary " +
            "introductions. Never answer only 'beep boop' unless asked."
        }]
      },
      contents: contents,
      generationConfig: {
        maxOutputTokens: 512,
        temperature: 0.7
      }
    })
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error("Gemini returned an invalid response.");
  }

  if (!response.ok) {
    const message = data.error?.message || "Unknown API error";

    if (response.status === 401 || response.status === 403) {
      throw new Error("API key rejected or access denied: " + message);
    }

    if (response.status === 404) {
      throw new Error(
        "Model not found. Check GEMINI_MODEL against the models " +
        "available to your API key."
      );
    }

    if (response.status === 429) {
      throw new Error("Gemini quota or rate limit reached.");
    }

    throw new Error("Gemini HTTP " + response.status + ": " + message);
  }

  const candidate = data.candidates?.[0];
  const text = candidate?.content?.parts
    ?.map(part => part.text || "")
    .join("")
    .trim();

  if (!text) {
    throw new Error(
      "Gemini returned no text. Finish reason: " +
      (candidate?.finishReason || "unknown")
    );
  }

  return {
    text: text,
    finishReason: candidate?.finishReason || "UNKNOWN"
  };
}

// Ask Gemini and continue if its answer hits the output limit.
async function askGemini(question) {
  const cleanQuestion = question.trim();

  if (!cleanQuestion) {
    throw new Error("I couldn't hear your question. Please try again.");
  }

  const contents = [
    ...history,
    {
      role: "user",
      parts: [{ text: cleanQuestion }]
    }
  ];

  let result = await generateGemini(contents);
  let answer = result.text;
  let attempts = 0;

  // Continue only when Gemini explicitly reports MAX_TOKENS.
  while (result.finishReason === "MAX_TOKENS" && attempts < 2) {
    attempts++;

    const continuationContents = [
      ...contents,
      {
        role: "model",
        parts: [{ text: answer }]
      },
      {
        role: "user",
        parts: [{
          text:
            "Continue exactly where your previous response ended. " +
            "Do not repeat any text already provided. Finish the " +
            "incomplete sentence and complete the answer concisely."
        }]
      }
    ];

    result = await generateGemini(continuationContents);

    const nextPart = result.text.trim();

    if (nextPart) {
      answer += " " + nextPart;
    }
  }

  if (result.finishReason === "MAX_TOKENS") {
    console.warn("Gemini may have reached its output limit.");
  }

  history.push(
    { role: "user", parts: [{ text: cleanQuestion }] },
    { role: "model", parts: [{ text: answer }] }
  );

  if (history.length > 10) {
    history = history.slice(-10);
  }

  return answer;
}

// ---------- SPEECH OUTPUT ----------

function speakAnswer(answer) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) {
      resolve();
      return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(answer);
    utterance.lang = "en-IN";
    utterance.rate = 0.95;
    utterance.pitch = 1.08;

    utterance.onend = resolve;
    utterance.onerror = event => {
      console.warn("Speech synthesis:", event.error);
      resolve();
    };

    speechSynthesis.speak(utterance);
  });
}

// ---------- SPEECH INPUT ----------

async function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    log("Speech recognition is unavailable. Try Chrome on Android.");
    return;
  }

  if (!characteristic) {
    log("Connect your TFT over Bluetooth first.");
    return;
  }

  if (!document.getElementById("apiKey").value.trim()) {
    log("Enter your Gemini API key first.");
    return;
  }

  if (busy) {
    log("Please wait for the current answer to finish.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = async () => {
    setStatus("Listening...");
    log("Listening... Speak now.");

    try {
      await sendStatus("LISTENING");
    } catch (error) {
      console.warn(error);
    }
  };

  recognition.onerror = async event => {
    setStatus("Microphone error");
    log(
      "Speech recognition error: " + event.error +
      "\n\nCheck microphone permission and internet connection."
    );

    try {
      await sendStatus("READY");
    } catch {}
  };

  recognition.onresult = async event => {
    const question = event.results[0][0].transcript.trim();

    if (!question) {
      log("I didn't hear anything. Please try again.");
      return;
    }

    busy = true;
    const currentRequest = ++requestNumber;

    try {
      setStatus("Thinking...");
      log("You: " + question + "\n\nBuddy is thinking...");

      await sendStatus("THINKING");

      const answer = await askGemini(question);

      if (currentRequest !== requestNumber) return;

      // Show the full answer on the phone.
      log("You: " + question + "\n\nBuddy: " + answer);

      // Send answer text to the TFT.
      try {
        await sendLines(answer);
      } catch (error) {
        console.warn("TFT text error:", error);
      }

      setStatus("Speaking...");
      await sendStatus("SPEAKING");

      // Speak the full combined answer, not only the first chunk.
      await speakAnswer(answer);

      setStatus("Ready to talk");
      await sendStatus("READY");

    } catch (error) {
      console.error("Mini AI Buddy:", error);

      log(
        "Sorry, I couldn't answer.\n\nError: " + error.message
      );

      setStatus("Request failed");

      try {
        await sendStatus("READY");
      } catch {}

    } finally {
      busy = false;
    }
  };

  recognition.onend = () => {
    if (!busy) setStatus("Ready to talk");
  };

  try {
    recognition.start();
  } catch (error) {
    log("Could not start microphone: " + error.message);
  }
}
</script>
</body>
</html>
